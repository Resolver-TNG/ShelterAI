name: AnpiApp
options:
  bundleIdPrefix: jp.resolver
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: jp.resolver.anpiapp

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "6.24.0"
  CoreML-LLM:
    url: https://github.com/john-rocky/CoreML-LLM
    branch: main

targets:
  AnpiApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/AnpiApp
      - path: Resources
        buildPhase: resources
        excludes:
          - "Models/**"
          - "Info.plist"
          - "AnpiApp.entitlements"
    postBuildScripts:
      - name: "Copy Gemma 4 Models"
        script: |
          MODEL_SRC="${SRCROOT}/Resources/Models/gemma-4-E2B-coreml"
          MODEL_DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Models/gemma-4-E2B-coreml"
          if [ -d "$MODEL_SRC" ]; then
            echo "Copying Gemma 4 model to bundle..."
            mkdir -p "$MODEL_DST"
            rsync -a --delete "$MODEL_SRC/" "$MODEL_DST/"
            echo "Model copy complete ($(du -sh "$MODEL_DST" | cut -f1))"
          else
            echo "warning: Model directory not found at $MODEL_SRC — skipping"
          fi
        basedOnDependencyAnalysis: false
    entitlements:
      path: Resources/AnpiApp.entitlements
    dependencies:
      - package: GRDB
        product: GRDB
      - package: CoreML-LLM
        product: CoreMLLLM
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 安否確認
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSLocationWhenInUseUsageDescription: "避難者の位置情報を記録するために使用します"
        NSCameraUsageDescription: "マイナカード等を撮影して情報を自動入力するために使用します"
        NSPhotoLibraryUsageDescription: "撮影した画像を保存するために使用します"
        NFCReaderUsageDescription: "マイナンバーカード等で本人確認を行うために使用します"
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
